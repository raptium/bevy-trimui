# Cross-compile settings for TrimUI Brick Pro (aarch64-unknown-linux-gnu).
# Run the Python builders with uv run: cross/zig selects the uv-locked Zig.
# The linker targets glibc 2.25 and embeds the firmware library path in RUNPATH.
#
# Relative paths here resolve against the directory *above* `.cargo/`, i.e. the
# repository root.
#
[target.aarch64-unknown-linux-gnu]
linker = "cross/zig-cc-wrapper"
