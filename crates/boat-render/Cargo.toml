[package]
name = "boat-render"
version = "0.1.0"
edition = "2024"
publish = false

[features]
brick-display = ["dep:wgpu", "dep:ash"]

[dependencies]
bevy = { workspace = true, features = ["bevy_render", "bevy_sprite_render", "bevy_log"] }
serde_json = "1"
wgpu = { version = "=29.0.4", optional = true, default-features = false, features = ["std", "vulkan", "wgsl"] }
ash = { version = "=0.38.0", optional = true, default-features = false, features = ["std", "loaded", "debug"] }
