# Standalone, app-local ALSA configuration for the Brick Pro.
# Do not include the system alsa.conf: its deferred /etc/asound.conf hook
# replaces pcm.default with the firmware's plug/softvol/dmix chain again.
# CPAL 0.17.3 stalls after its first callback through that chain on this unit.
# Rodio mixes the game's voices; the firmware still controls hardware volume.
pcm.!default {
    type hw
    card audiocodec
    device 0
}
ctl.!default {
    type hw
    card audiocodec
}
