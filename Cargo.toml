[workspace]
resolver = "3"
members = ["crates/bevy-trimui"]

[workspace.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "default_app", "std", "multi_threaded", "bevy_asset", "bevy_image",
    "bevy_window", "bevy_sprite", "png",
] }

[profile.release]
opt-level = 2
panic = "abort"
strip = "symbols"
