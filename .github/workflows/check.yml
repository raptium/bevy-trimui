name: Kit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install host tools
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m pip install ziglang==0.17.0
          mkdir -p .ci-bin
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > .ci-bin/zig
          chmod +x .ci-bin/zig
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          rustup target add aarch64-unknown-linux-gnu
      - name: Check Python and Rust formatting
        run: |
          python3 -m compileall -q tools
          rustup component add rustfmt
          cargo fmt --manifest-path experiments/bevy-spike/Cargo.toml -- --check
      - name: Build and package without device access
        run: |
          python3 tools/device/build_bevy_spike.py
          python3 tools/device/package_bevy_spike.py --seconds 30
