name: Kit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked tools
        run: |
          uv sync --locked
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          rustup target add aarch64-unknown-linux-gnu
      - name: Check Python tools and Rust formatting
        run: |
          uv run --locked python -m compileall -q tools cross
          uv run --locked python -m unittest discover -s tests
          rustup component add rustfmt
          cargo fmt --manifest-path experiments/bevy-spike/Cargo.toml -- --check
      - name: Build and package without device access
        run: |
          uv run --locked tools/device/build_bevy_spike.py
          uv run --locked tools/device/package_bevy_spike.py --seconds 30
